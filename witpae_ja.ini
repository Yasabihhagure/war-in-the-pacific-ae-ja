; War in the Pacific AE Japanese localization - settings
; War in the Pacific AE 日本語化 設定
; Details / 詳細: witpae_ja\README.en.md, witpae_ja\README.md

[Font]
; Japanese font name
; 日本語フォント名
Face=MS Gothic
; 128 = SHIFTJIS_CHARSET
Charset=128
; Height adjustment for the replaced game font (pixels; + larger, - smaller). Used only when Replace=1
; 文字の高さの補正（ピクセル。正で大きく、負で小さく）
HeightAdjust=0
; 0 = do not replace the game's font (leave at 0)
; 0 にするとフォントを差し替えない
Replace=0

[Text]
; 0 = do not translate (game stays in English)
; 0 にすると訳文に置き換えない（英語のまま）
Translate=1
; 0 = do not hook the game's drawing functions (no Japanese is shown)
; 0 にするとゲーム内部の描画関数を差し替えない（日本語は表示されない）
GameHooks=1
; Line width of scenario descriptions (pixels; the game's frame is 280). Lower it if Japanese lines are cut off
; シナリオ説明の1行の幅（ピクセル）。ゲームの枠は 280。日本語の行がまだ欠けるなら小さくする
ScenWidth=270

[Debug]
; 1 = log drawn strings to witpae_ja_log.txt (for translation work; the file grows large)
; 1 で描画された文字列を witpae_ja_log.txt に記録する（訳の作業用。ファイルが大きくなる）
LogText=0

[Display]
; 1 = ignore Windows display scaling (prevents the screen from being cut off)
; 1 で Windows の表示スケールによる拡大を止める（画面が切れる対策）
DpiAware=1
; Window scale in windowed mode (-w): auto = largest that fits the screen, 0 = no scaling, or a number such as 1.5
; ウィンドウモード（-w）のときの拡大率。auto=画面に収まる最大、0=拡大しない、1.5 などの数値も可
Scale=auto
; 1 = borderless full-screen window (no Alt+Tab corruption; black bars on the sides)
; 1 で枠なしの全画面ウィンドウにする（Alt+Tab でも乱れない。左右の余白は黒）
Borderless=0
; 1 = smooth scaling (0 = sharper/blockier but lighter)
; 1 でなめらかに拡大する（0 だと粗いが軽い）
Smooth=1

[JpFont]
; Height adjustment for Japanese text (pixels; negative = smaller, shifted down by half the reduction)
; 日本語の文字の高さの補正（ピクセル。負で小さく。小さくした分の半分だけ下へずらす）
HeightAdjust=-2
; Vertical offset for Japanese text (pixels; positive = down)
; 日本語の文字の上下位置の補正（ピクセル。正で下へ）
YOffset=0
