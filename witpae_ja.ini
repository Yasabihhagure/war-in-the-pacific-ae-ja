; War in the Pacific AE 日本語化 設定
[Font]
; 日本語フォント名
Face=MS Gothic
; 128 = SHIFTJIS_CHARSET
Charset=128
; 文字の高さの補正（ピクセル。正で大きく、負で小さく）
HeightAdjust=0
; 0 にするとフォントを差し替えない
Replace=0

[Text]
; 0 にすると訳文に置き換えない（英語のまま）
Translate=1

[Debug]
; 1 で描画された文字列を witpae_ja_log.txt に記録する
LogText=1

[Display]
; 1 で Windows の表示スケールによる拡大を止める（画面が切れる対策）
DpiAware=1
